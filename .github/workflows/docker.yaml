name: Build and Push Docker Image (mutinynet2)

on:
  push:
    branches:
      - mutinynet2
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Hardcoded target repo so it never depends on the value of the login
  # username secret; DOCKERHUB_* creds just need push rights to this namespace.
  IMAGE_NAME: kaleidoswap/rgb-lightning-node
  IMAGE_TAG: mutinynet2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + push image (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:mutinynet2-${{ github.sha }}
          cache-from: type=gha,scope=mutinynet2-amd64
          cache-to: type=gha,scope=mutinynet2-amd64,mode=max
